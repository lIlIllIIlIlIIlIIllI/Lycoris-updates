name: Publish verified Stage 12 cross-site preview APK
on:
  push:
    branches: [stage12-preview-delivery]
    paths: ['stage12-preview/**', '.github/workflows/stage12-preview.yml', 'distribution/publish-stage12.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-stage12-preview-code53
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates' && github.ref == 'refs/heads/stage12-preview-delivery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed APK, publish new pre-release and advance requested device update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/publish-stage12.py
