name: Publish verified Preview.6 home and auto subtitles preview
on:
  push:
    branches: [stage13-home-preview6]
    paths: ['stage13-preview6/**', '.github/workflows/preview6-home.yml', 'distribution/publish-preview6.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-preview-code57
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates' && github.ref == 'refs/heads/stage13-home-preview6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed APK, publish new pre-release and advance requested device update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/publish-preview6.py
