name: Publish verified Moeni content recovery preview
on:
  push:
    branches: [moeni-preview3-delivery]
    paths: ['moeni-preview3/**', '.github/workflows/moeni-fix-preview.yml', 'distribution/publish-moeni-fix.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-moeni-fix-preview-code54
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates' && github.ref == 'refs/heads/moeni-preview3-delivery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed APK, publish new pre-release and advance requested device update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/publish-moeni-fix.py
