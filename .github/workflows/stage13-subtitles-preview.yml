name: Publish verified Stage 13 subtitle provider preview
on:
  push:
    branches: [stage13-subtitles-preview4]
    paths: ['stage13-preview4/**', '.github/workflows/stage13-subtitles-preview.yml', 'distribution/publish-stage13.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-stage13-preview-code55
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates' && github.ref == 'refs/heads/stage13-subtitles-preview4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed APK, publish new pre-release and advance requested device update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/publish-stage13.py
