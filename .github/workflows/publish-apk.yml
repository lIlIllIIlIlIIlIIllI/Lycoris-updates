name: Publish verified Lycoris APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag
        required: true
        type: string
      asset_commit:
        description: Immutable release-assets commit SHA
        required: true
        type: string
      metadata_sha256:
        description: SHA256 of the approved update.json
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-lycoris-apk
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.asset_commit }}
          path: .release-assets
          sparse-checkout: releases
          persist-credentials: false
      - name: Verify immutable signed APK, publish trial and advance public version metadata
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_ASSET_COMMIT: ${{ inputs.asset_commit }}
          APPROVED_METADATA_SHA256: ${{ inputs.metadata_sha256 }}
        run: python3 distribution/publish.py
