name: Publish verified Stage 10 preview and device update metadata
on:
  push:
    branches: [stage10-preview-delivery]
    paths: ['stage10-preview/**', '.github/workflows/stage10-preview.yml', 'distribution/publish-stage10.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-stage10-preview10
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lIlIllIIlIlIIlIIllI/Lycoris-updates' && github.ref == 'refs/heads/stage10-preview-delivery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed immutable APKs and publish new preview before advancing update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/publish-stage10.py
